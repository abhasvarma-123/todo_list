<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑Do List App</title>
  <style>
    :root{
      --bg:#0f172a; --card:#0b1220; --muted:#94a3b8; --accent:#60a5fa; --success:#34d399; --danger:#fb7185;
      --glass: rgba(255,255,255,0.04);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background: linear-gradient(180deg,#071027 0%, #071827 100%); color:#e6eef8; display:flex; align-items:center; justify-content:center; padding:28px;
    }

    .app{
      width:100%; max-width:980px; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:14px; padding:20px; box-shadow:0 8px 30px rgba(2,6,23,0.6);
      border:1px solid rgba(255,255,255,0.03);
    }

    header{display:flex; align-items:center; gap:16px;}
    header h1{margin:0; font-size:20px}
    header p{margin:0; color:var(--muted); font-size:13px}

    .grid{display:grid; grid-template-columns: 360px 1fr; gap:18px; margin-top:18px}

    .card{background:var(--card); padding:14px; border-radius:12px; border:1px solid rgba(255,255,255,0.02)}

    form label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px}
    input[type="text"], input[type="date"], select{width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.03); background:var(--glass); color:inherit}
    .row{display:flex; gap:10px}
    .btn{padding:10px 12px; border-radius:10px; border:none; cursor:pointer; font-weight:600}
    .btn-primary{background:var(--accent); color:#03203a}
    .btn-ghost{background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,0.02)}
    .small{font-size:13px; padding:8px 10px}

    .filters{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap}
    .pill{padding:8px 10px; background:transparent; border-radius:999px; border:1px solid rgba(255,255,255,0.02); cursor:pointer}
    .pill.active{background:linear-gradient(90deg, rgba(96,165,250,0.12), rgba(96,165,250,0.06)); border-color:rgba(96,165,250,0.25)}

    .task-list{margin-top:12px; display:flex; flex-direction:column; gap:8px; max-height:520px; overflow:auto; padding-right:8px}
    .task{display:flex; gap:12px; align-items:flex-start; padding:10px; border-radius:10px; background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00)); border:1px solid rgba(255,255,255,0.02)}
    .task .left{display:flex; gap:12px; align-items:center}
    .checkbox{width:18px; height:18px; border-radius:5px; border:1px solid rgba(255,255,255,0.06); display:inline-grid; place-items:center; cursor:pointer}
    .checkbox.checked{background:linear-gradient(90deg,var(--success), #10b981); border:none}
    .task .title{font-weight:600}
    .muted{color:var(--muted); font-size:13px}
    .category{font-size:12px; padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,0.02)}

    .task .actions{margin-left:auto; display:flex; gap:8px}
    .icon-btn{background:transparent; border:1px solid rgba(255,255,255,0.02); padding:6px 8px; border-radius:8px; cursor:pointer}

    footer.stats{display:flex; gap:12px; align-items:center; margin-top:12px; color:var(--muted); font-size:13px}
    @media (max-width:880px){.grid{grid-template-columns:1fr;}}

  </style>
</head>
<body>
  <main class="app" role="main">
    <header>
      <div>
        <h1>To‑Do List</h1>
        <p>Manage tasks — saved locally in your browser.</p>
      </div>
      <div style="margin-left:auto" aria-hidden>
        <span class="muted">Tip:</span> <span class="muted">Press Enter to add</span>
      </div>
    </header>

    <section class="grid" aria-label="todo app">
      <aside class="card" aria-labelledby="addTaskHeading">
        <h2 id="addTaskHeading" style="margin:0 0 10px 0; font-size:15px">Add Task</h2>

        <form id="taskForm">
          <label for="title">Task</label>
          <input id="title" type="text" placeholder="e.g. Finish project report" required />

          <div style="height:10px"></div>
          <label for="category">Category</label>
          <select id="category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>
          </select>

          <div style="height:10px"></div>
          <label for="due">Due date (optional)</label>
          <input id="due" type="date" />

          <div style="height:12px"></div>
          <div class="row">
            <button class="btn btn-primary" type="submit">Add task</button>
            <button type="button" id="clearAll" class="btn btn-ghost small">Clear all</button>
            <button type="button" id="exportBtn" class="btn small">Export</button>
            <button type="button" id="importBtn" class="btn small btn-ghost">Import</button>
          </div>
        </form>

        <div style="height:14px"></div>
        <div>
          <strong>Categories</strong>
          <div class="filters" id="categoryFilters" style="margin-top:8px">
            <!-- dynamic category pills -->
          </div>
        </div>

      </aside>

      <section class="card">
        <div style="display:flex; align-items:center; gap:12px;">
          <div style="flex:1">
            <div class="filters" role="tablist" aria-label="filters">
              <button class="pill active" data-filter="all">All</button>
              <button class="pill" data-filter="active">Active</button>
              <button class="pill" data-filter="completed">Completed</button>
            </div>
          </div>

          <div style="display:flex; gap:8px; align-items:center">
            <label class="muted" for="sort">Sort</label>
            <select id="sort" aria-label="sort tasks">
              <option value="created_desc">Newest</option>
              <option value="created_asc">Oldest</option>
              <option value="due_asc">Due Soon</option>
              <option value="due_desc">Due Later</option>
            </select>
          </div>
        </div>

        <div id="taskList" class="task-list" aria-live="polite"></div>

        <footer class="stats" aria-hidden>
          <span id="countAll">0 tasks</span>
          <span id="countActive">0 active</span>
          <span id="countCompleted">0 completed</span>
        </footer>

      </section>
    </section>

  </main>

  <script>
    // Simple To‑Do app with localStorage persistence
    const STORAGE_KEY = 'todo_app_v1';

    // Elements
    const taskForm = document.getElementById('taskForm');
    const titleInput = document.getElementById('title');
    const dueInput = document.getElementById('due');
    const categorySelect = document.getElementById('category');
    const taskList = document.getElementById('taskList');
    const clearAllBtn = document.getElementById('clearAll');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const categoryFilters = document.getElementById('categoryFilters');
    const sortSelect = document.getElementById('sort');

    let tasks = loadTasks();
    let uiFilter = 'all';
    let categoryFilter = 'All';

    // Initialize
    render();
    populateCategoryPills();

    // --------------------- storage ---------------------
    function saveTasks(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function loadTasks(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return [];
        return JSON.parse(raw).map(t => ({...t, dueDate: t.dueDate || null}));
      }catch(e){
        console.error('Failed loading tasks', e);
        return [];
      }
    }

    // --------------------- task model ---------------------
    function makeTask(title, category, dueDate){
      return {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,8),
        title: title.trim(),
        category: category || 'Other',
        dueDate: dueDate || null,
        completed: false,
        createdAt: Date.now()
      };
    }

    // --------------------- events ---------------------
    taskForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const title = titleInput.value.trim();
      if(!title) return;
      const category = categorySelect.value;
      const due = dueInput.value || null;
      const t = makeTask(title, category, due);
      tasks.push(t);
      titleInput.value=''; dueInput.value='';
      saveTasks(); render(); populateCategoryPills();
    });

    clearAllBtn.addEventListener('click', ()=>{
      if(!confirm('Clear ALL tasks?')) return;
      tasks = []; saveTasks(); render(); populateCategoryPills();
    });

    exportBtn.addEventListener('click', ()=>{
      const data = JSON.stringify(tasks, null, 2);
      const blob = new Blob([data],{type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'tasks.json'; a.click();
      URL.revokeObjectURL(url);
    });

    importBtn.addEventListener('click', ()=>{
      const input = document.createElement('input');
      input.type='file'; input.accept='application/json';
      input.onchange = (ev)=>{
        const f = ev.target.files[0];
        if(!f) return;
        const reader = new FileReader();
        reader.onload = ()=>{
          try{
            const imported = JSON.parse(reader.result);
            if(!Array.isArray(imported)) throw new Error('Invalid file');
            // Merge but avoid duplicates by id
            const map = new Map(tasks.map(t=>[t.id,t]));
            imported.forEach(it=>{ if(!map.has(it.id)) map.set(it.id,it)});
            tasks = Array.from(map.values()); saveTasks(); render(); populateCategoryPills();
            alert('Imported ' + imported.length + ' tasks');
          }catch(err){ alert('Failed to import: ' + err.message); }
        };
        reader.readAsText(f);
      };
      input.click();
    });

    // Filter pills
    document.querySelectorAll('.pill').forEach(b=>{
      b.addEventListener('click', ()=>{
        document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
        b.classList.add('active'); uiFilter = b.dataset.filter; render();
      });
    });

    sortSelect.addEventListener('change', ()=>render());

    // --------------------- render ---------------------
    function render(){
      const filtered = tasks.filter(t=>{
        if(uiFilter==='active' && t.completed) return false;
        if(uiFilter==='completed' && !t.completed) return false;
        if(categoryFilter && categoryFilter!=='All' && t.category!==categoryFilter) return false;
        return true;
      });

      // Sorting
      const sort = sortSelect.value;
      filtered.sort((a,b)=>{
        if(sort==='created_desc') return b.createdAt - a.createdAt;
        if(sort==='created_asc') return a.createdAt - b.createdAt;
        if(sort==='due_asc') return (a.dueDate||'9999') > (b.dueDate||'9999') ? 1 : -1;
        if(sort==='due_desc') return (a.dueDate||'0000') > (b.dueDate||'0000') ? -1 : 1;
        return 0;
      });

      taskList.innerHTML='';
      if(filtered.length===0){
        const el = document.createElement('div'); el.className='muted'; el.textContent = 'No tasks found — add one!'; taskList.appendChild(el);
      }

      filtered.forEach(t=>{
        const row = document.createElement('div'); row.className='task';

        const left = document.createElement('div'); left.className='left';

        const cb = document.createElement('div'); cb.className='checkbox'; if(t.completed) cb.classList.add('checked');
        cb.setAttribute('role','button'); cb.setAttribute('aria-pressed', String(!!t.completed)); cb.title='Toggle complete';
        cb.addEventListener('click', ()=>{ t.completed = !t.completed; saveTasks(); render(); });

        const meta = document.createElement('div');
        const title = document.createElement('div'); title.className='title'; title.textContent = t.title;
        if(t.completed) title.style.textDecoration = 'line-through';

        const details = document.createElement('div'); details.className='muted';
        const dueText = t.dueDate ? (new Date(t.dueDate)).toLocaleDateString() : null;
        details.textContent = t.category + (dueText ? ' · due ' + dueText : '');

        meta.appendChild(title); meta.appendChild(details);

        left.appendChild(cb); left.appendChild(meta);

        const actions = document.createElement('div'); actions.className='actions';
        // edit
        const edit = document.createElement('button'); edit.className='icon-btn'; edit.title='Edit'; edit.innerHTML='✏️';
        edit.addEventListener('click', ()=>{ openEdit(t.id); });
        // delete
        const del = document.createElement('button'); del.className='icon-btn'; del.title='Delete'; del.innerHTML='🗑️';
        del.addEventListener('click', ()=>{ if(confirm('Delete this task?')) { tasks = tasks.filter(x=>x.id!==t.id); saveTasks(); render(); populateCategoryPills(); } });

        actions.appendChild(edit); actions.appendChild(del);

        row.appendChild(left);
        row.appendChild(actions);

        taskList.appendChild(row);
      });

      // stats
      document.getElementById('countAll').textContent = tasks.length + (tasks.length===1? ' task':' tasks');
      document.getElementById('countActive').textContent = tasks.filter(t=>!t.completed).length + ' active';
      document.getElementById('countCompleted').textContent = tasks.filter(t=>t.completed).length + ' completed';
    }

    // --------------------- edit ---------------------
    function openEdit(id){
      const t = tasks.find(x=>x.id===id); if(!t) return;
      const newTitle = prompt('Edit title', t.title); if(newTitle===null) return; // canceled
      t.title = newTitle.trim() || t.title;
      const newCategory = prompt('Category', t.category);
      if(newCategory!==null) t.category = newCategory.trim() || t.category;
      const newDue = prompt('Due date (YYYY-MM-DD) or leave blank', t.dueDate || '');
      if(newDue!==null) t.dueDate = newDue.trim() || null;
      saveTasks(); render(); populateCategoryPills();
    }

    // --------------------- categories ---------------------
    function populateCategoryPills(){
      const cats = Array.from(new Set(['All', ...tasks.map(t=>t.category)]));
      categoryFilters.innerHTML='';
      cats.forEach(cat=>{
        const b = document.createElement('button'); b.className='pill' + (cat===categoryFilter ? ' active' : ''); b.textContent = cat; b.addEventListener('click', ()=>{
          categoryFilter = cat; document.querySelectorAll('#categoryFilters .pill').forEach(x=>x.classList.remove('active'));
          b.classList.add('active'); render();
        });
        categoryFilters.appendChild(b);
      });
    }

    // --------------------- keyboard shortcuts ---------------------
    document.addEventListener('keydown', (e)=>{
      if(e.key==='n' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); titleInput.focus(); }
    });

    // expose for console for debugging
    window.__todo = {tasks, saveTasks, loadTasks};
  </script>
</body>
</html>
